name: "T0: Tests"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:

  gate:
    uses: $/.github/workflows/_ci-gate.yml

  build-and-test:

    name: "T0 · build & test"

    needs: gate

    if: needs.gate.outputs.run_tier0 == 'true'

    concurrency:
      group: tier-0-tests-${{ github.event.pull_request.number || github.ref }}-${{ strategy.job-index }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier0 == 'true' }}

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # `spec` is the only base dimension, so it is the only value GitHub
        # puts in the check name. The compiler, its C++ driver and the build
        # type ride along in `include:` and stay out of the name.
        spec:
          - gcc-debug
          - clang-release
        include:
          - spec: gcc-debug
            cc: "gcc-14"
            cxx: "g++-14"
            build-type: "Debug"
          - spec: clang-release
            cc: "clang-18"
            cxx: "clang++-18"
            build-type: "Release"

    env:
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/chaste-test-dir
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - name: checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: install dependencies
      run: |
        echo 'deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu noble/' | sudo tee -a /etc/apt/sources.list.d/chaste.list
        sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
        sudo apt update
        sudo apt install chaste-dependencies

    - name: compiler version
      run: |
        ${CXX} --version

    - name: make build and test directories
      run: |
        mkdir -p chaste-build-dir
        mkdir -p ${CHASTE_TEST_OUTPUT}

    - name: cmake configure
      run: cmake -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} ..
      working-directory: chaste-build-dir

    - name: build core libraries
      run: cmake --build . --parallel 4 --target chaste_core
      working-directory: chaste-build-dir

    - name: build cell_based
      run: cmake --build . --parallel 4 --target chaste_cell_based
      working-directory: chaste-build-dir

    - name: build crypt
      run: cmake --build . --parallel 4 --target chaste_crypt
      working-directory: chaste-build-dir

    - name: build heart
      run: cmake --build . --parallel 4 --target chaste_heart
      working-directory: chaste-build-dir

    - name: build lung
      run: cmake --build . --parallel 4 --target chaste_lung
      working-directory: chaste-build-dir

    - name: build continuous test pack
      run: cmake --build . --parallel 4 --target Continuous
      working-directory: chaste-build-dir

    - name: build nightly test pack
      run: cmake --build . --parallel 4 --target Nightly
      working-directory: chaste-build-dir

    - name: build parallel test pack
      run: cmake --build . --parallel 4 --target Parallel
      working-directory: chaste-build-dir

    - name: run Continuous test pack
      run: ctest -j4 -L Continuous --output-on-failure
      working-directory: chaste-build-dir

    - name: run Nightly test pack
      run: ctest -j4 -L Nightly --output-on-failure
      working-directory: chaste-build-dir

    - name: run Parallel test pack
      run: ctest -j4 -L Parallel --output-on-failure
      working-directory: chaste-build-dir

    - name: run TestChasteBuildInfo
      run: |
        ctest -V -R TestChasteBuildInfo
      working-directory: chaste-build-dir

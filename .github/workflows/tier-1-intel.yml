name: "T1: Intel Compiler"

# The one full build-and-test using the Intel compiler. Deliberately its own
# workflow, separate from tier-1-compilers.yml, so it is never confused with
# that file's compile-only sweep: this job builds every library AND runs the
# Continuous/Nightly/Parallel test packs, not just a build check.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

jobs:

  gate:
    uses: $/.github/workflows/_ci-gate.yml

  build-and-test:

    name: "T1 · intel compiler"

    needs: gate

    if: needs.gate.outputs.run_tier1 == 'true'

    concurrency:
      group: tier-1-intel-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier1 == 'true' }}

    runs-on: ubuntu-24.04

    # One-value matrix: GitHub names a running job "<name> (ran)" but a
    # skipped one just "<name>", so a skipped re-run (e.g. from an
    # unrelated relabel) posts a separate bare row instead of overwriting
    # the real "(ran)" check. See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [ran]

    env:
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/chaste-test-dir
      CC: icx
      CXX: icpx

    steps:
    - name: checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: install dependencies
      run: |
        echo 'deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu noble/' | sudo tee -a /etc/apt/sources.list.d/chaste.list
        sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
        sudo apt update
        sudo apt install chaste-dependencies

    - name: install and set up Intel LLVM compiler
      run: |
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        sudo apt update
        sudo apt install intel-oneapi-compiler-dpcpp-cpp
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV

    - name: compiler version
      run: |
        ${CXX} --version

    - name: make build and test directories
      run: |
        mkdir -p chaste-build-dir
        mkdir -p ${CHASTE_TEST_OUTPUT}

    - name: cmake configure
      run: cmake -DCMAKE_BUILD_TYPE=Release ..
      working-directory: chaste-build-dir

    - name: build core libraries
      run: cmake --build . --parallel 4 --target chaste_core
      working-directory: chaste-build-dir

    - name: build cell_based
      run: cmake --build . --parallel 4 --target chaste_cell_based
      working-directory: chaste-build-dir

    - name: build crypt
      run: cmake --build . --parallel 4 --target chaste_crypt
      working-directory: chaste-build-dir

    - name: build heart
      run: cmake --build . --parallel 4 --target chaste_heart
      working-directory: chaste-build-dir

    - name: build lung
      run: cmake --build . --parallel 4 --target chaste_lung
      working-directory: chaste-build-dir

    - name: build continuous test pack
      run: cmake --build . --parallel 4 --target Continuous
      working-directory: chaste-build-dir

    - name: build nightly test pack
      run: cmake --build . --parallel 4 --target Nightly
      working-directory: chaste-build-dir

    - name: build parallel test pack
      run: cmake --build . --parallel 4 --target Parallel
      working-directory: chaste-build-dir

    - name: run Continuous test pack
      run: ctest -j4 -L Continuous --output-on-failure
      working-directory: chaste-build-dir

    - name: run Nightly test pack
      run: ctest -j4 -L Nightly --output-on-failure
      working-directory: chaste-build-dir

    - name: run Parallel test pack
      run: ctest -j4 -L Parallel --output-on-failure
      working-directory: chaste-build-dir

    - name: run TestChasteBuildInfo
      run: |
        ctest -V -R TestChasteBuildInfo
      working-directory: chaste-build-dir

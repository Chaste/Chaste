name: "T0: Doxygen"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  gate:
    uses: $/.github/workflows/_ci-gate.yml

  coverage:
    name: "T0 · doxygen coverage"
    runs-on: ubuntu-latest

    needs: gate

    if: >
      needs.gate.outputs.run_tier0 == 'true' &&
      github.repository == 'Chaste/Chaste'

    concurrency:
      group: tier-0-doxygen-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier0 == 'true' }}

    # One-value matrix: GitHub names a running job "<name> (ran)" but a
    # skipped one just "<name>", so a skipped re-run (e.g. from an
    # unrelated relabel) posts a separate bare row instead of overwriting
    # the real "(ran)" check. See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [ran]

    env:
      # Pinned (not auto-updated) so generated HTML stays byte-stable between
      # runs; bump both together when a version change is actually wanted.
      DOXYGEN_VERSION: "1.9.8"
      DOXYGEN_SHA256: "dda773bdc62384b7d796fe8b6c5029daad72483e4c8ad4abf6ee9fb98b649388"

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install dependencies
        run: |
          sudo apt-get install graphviz
          wget "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" | sha256sum -c -
          tar -xzvf "doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"

      - name: build doxygen
        run: |
          ( cat Doxyfile ; echo "PROJECT_NUMBER=PR_branch::${GITHUB_HEAD_REF}" ) | "doxygen-${DOXYGEN_VERSION}/bin/doxygen" - 2>doxygen-error.log 1>doxygen-output.log

      - name: check doxygen coverage
        run: |
          mkdir doxygen/coverage
          python python/infra/ParseDoxygen.py doxygen-output.log doxygen-error.log doxygen/coverage

      - name: print doxygen coverage errors
        if: failure()
        run: |
          echo "Printing file contents:"
          for FILE in doxygen/coverage/*; do
          echo "------------------------"
          echo "Contents of $FILE:"
          cat "$FILE"
          echo "------------------------"
          done

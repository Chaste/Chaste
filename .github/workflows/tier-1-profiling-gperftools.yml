name: "T1: Profiling (gperftools)"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:

  gate:
    uses: $/.github/workflows/_ci-gate.yml

  build-and-test:

    name: "T1 · gperftools profiling run"

    needs: gate

    if: needs.gate.outputs.run_tier1 == 'true'

    concurrency:
      group: tier-1-profiling-gperftools-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier1 == 'true' }}

    runs-on: ubuntu-24.04

    # One-value matrix: GitHub names a running job "<name> (ran)" but a
    # skipped one just "<name>", so a skipped re-run (e.g. from an
    # unrelated relabel) posts a separate bare row instead of overwriting
    # the real "(ran)" check. See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [ran]

    env:
      CHASTE_DIR: ${{ github.workspace }}/Chaste
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/chaste-test-dir
      CHASTE_BUILD_DIR: ${{ github.workspace }}/Chaste/chaste-build-dir
      GPERFTOOLS_VERSION: gperftools-2.18.1
      GPERFTOOLS_PREFIX: ${{ github.workspace }}/gperftools-install
      GO_PPROF_VERSION: v0.0.0-20260604005048-7023385849c0
      CPUPROFILE_FREQUENCY: 1000

    outputs:
      index: ${{ steps.index-exists.outputs.index }}
      datetime: ${{ steps.get-datetime.outputs.datetime }}

    steps:

      - name: get current datetime
        id: get-datetime
        run: echo "datetime=$(date +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_OUTPUT

      - name: checkout Chaste
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Chaste/Chaste
          path: Chaste
          persist-credentials: false

      - name: install dependencies
        run: |
          echo 'deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu noble/' | sudo tee -a /etc/apt/sources.list.d/chaste.list
          sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
          sudo apt update
          sudo apt install chaste-dependencies

      - name: install gperftools build dependencies and graphviz
        run: sudo apt install autoconf automake libtool libunwind-dev graphviz

      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: cache go pprof
        id: cache-pprof
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/pprof
          key: go-pprof-${{ runner.os }}-${{ env.GO_PPROF_VERSION }}

      - name: install go pprof
        if: steps.cache-pprof.outputs.cache-hit != 'true'
        run: go install github.com/google/pprof@${GO_PPROF_VERSION}

      - name: add go bin to path
        run: echo "${HOME}/go/bin" >> $GITHUB_PATH

      - name: cache gperftools
        id: cache-gperftools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GPERFTOOLS_PREFIX }}
          key: gperftools-${{ runner.os }}-${{ env.GPERFTOOLS_VERSION }}

      - name: build gperftools from source
        if: steps.cache-gperftools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${GPERFTOOLS_VERSION} https://github.com/gperftools/gperftools.git gperftools-src
          cd gperftools-src
          ./autogen.sh
          ./configure --prefix=${GPERFTOOLS_PREFIX} --enable-libunwind
          make -j4
          make install

      - name: make build and test directories
        run: |
          mkdir -p ${CHASTE_BUILD_DIR}
          mkdir -p ${CHASTE_TEST_OUTPUT}

      - name: cmake configure
        run: >-
          cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DChaste_ERROR_ON_WARNING=OFF
          -DChaste_PROFILE_GPERFTOOLS=ON
          -DGperftools_ROOT_DIR=${GPERFTOOLS_PREFIX}
          -DCMAKE_PREFIX_PATH=${GPERFTOOLS_PREFIX}
          ..
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: run TestChasteBuildInfo
        run: |
          cmake --build . --target TestChasteBuildInfo --parallel 4
          ctest -V -R TestChasteBuildInfo
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: build profiling test pack
        run: cmake --build . --target Profile --parallel 4
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: run profiling tests
        run: cmake --build . --target profile --parallel 1
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: check if index file successfully created
        id: index-exists
        run: |
          if [ -e ${CHASTE_BUILD_DIR}/profile/index.html ]; then
            echo "Index file exists"
            echo "index=True"  >> $GITHUB_OUTPUT
          else
            echo "Index file does not exist"
            echo "index=False"  >> $GITHUB_OUTPUT
          fi
        if: always()

      - name: upload profile artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-files
          path: ${{ env.CHASTE_BUILD_DIR }}/profile
        if: always() && steps.index-exists.outputs.index == 'True'


  publish-results:

    name: "T1 · publish gperftools results (non-fork PRs only)"
    needs: build-and-test
    runs-on: ubuntu-latest
    # only when index exists AND it's being run from the primary repo (Chaste/Chaste)
    if: ${{needs.build-and-test.outputs.index == 'True' && github.repository == 'Chaste/Chaste' }}

    # One-value matrix: GitHub names a running job "<name> (ran)" but a
    # skipped one just "<name>", so a skipped re-run (e.g. from an
    # unrelated relabel) posts a separate bare row instead of overwriting
    # the real "(ran)" check. See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [ran]

    env:
      GPERFTOOLS_RESULTS_DIR: ${{ github.workspace }}/profiling-gperftools

    steps:

      - name: download profile artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-files
          path: ./profile

      - name: checkout results repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Chaste/profiling-gperftools
          path: profiling-gperftools
          fetch-depth: 0
          token: ${{ secrets.PROFILING_GPERFTOOLS_ACCESS }}
          persist-credentials: false

      - name: copy results
        # raw .prof files are deliberately not published: they are only useful with the
        # matching test binaries, and remain available in the workflow artifact.
        # The run id is appended to the directory name so concurrent runs (which could
        # otherwise share the same datetime) never collide.
        run: |
          RESULTS_SUBDIR="${NEEDS_BUILD_AND_TEST_OUTPUTS_DATETIME}-${GITHUB_RUN_ID}"
          mkdir "${GPERFTOOLS_RESULTS_DIR}/log-files/${RESULTS_SUBDIR}"
          cp ./profile/*.txt ./profile/*.svg ./profile/index.html "${GPERFTOOLS_RESULTS_DIR}/log-files/${RESULTS_SUBDIR}/"
        env:
          NEEDS_BUILD_AND_TEST_OUTPUTS_DATETIME: ${{ needs.build-and-test.outputs.datetime }}

      - name: commit and push results
        # log-files/index.html is generated at Pages deploy time in the results repo
        # (not committed from here), so each run only ever adds its own new,
        # disjoint directory; a rebase-and-retry on a rejected push is therefore
        # always conflict-free against concurrent runs.
        run: |
          git config user.name "github-action"
          git config user.email "github-action"
          git add --all
          git commit -m "upload gperftools profiling results" || echo "No changes to commit"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Chaste/profiling-gperftools.git"
          for attempt in 1 2 3 4 5; do
            git push && break
            if [ "${attempt}" -eq 5 ]; then
              echo "push failed after 5 attempts" >&2
              exit 1
            fi
            sleep "$(( (RANDOM % 5) + 1 ))"
            echo "push rejected, pulling and retrying (attempt ${attempt})"
            git pull --rebase
          done
        working-directory: ${{ env.GPERFTOOLS_RESULTS_DIR }}
        env:
          TOKEN: ${{ secrets.PROFILING_GPERFTOOLS_ACCESS }}

      - name: results URL on chaste.github.io
        run: |
          echo "https://chaste.github.io/profiling-gperftools/${NEEDS_BUILD_AND_TEST_OUTPUTS_DATETIME}-${GITHUB_RUN_ID}/index.html"
        env:
          NEEDS_BUILD_AND_TEST_OUTPUTS_DATETIME: ${{ needs.build-and-test.outputs.datetime }}

name: "T1: PyChaste tutorials"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - '**'
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:

  gate:
    uses: ./.github/workflows/_ci-gate.yml

  generate-tutorial-markdown:
    name: "T1 · generate pychaste tutorials"
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.run_tier1 == 'true'
    concurrency:
      group: tier-1-update-pychaste-tutorials-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier1 == 'true' }}
    # Single-entry matrix: a skipped re-run then posts only the bare "T1 · ..."
    # check and cannot overwrite this job's real "T1 · ... (default)" result.
    # See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [default]
    steps:
      - name: checkout Chaste
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history in order to get revision info for tutorial files

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: install dependencies
        run: |
          python -m pip install jupyterlab

      - name: generate pychaste tutorial markdown
        run: |
          python GeneratePyChasteTutorials.py
        working-directory: python/infra

      - name: upload archive files
        uses: actions/upload-artifact@v7
        with:
          name: pychaste-tutorial-markdown
          path: |
            pychaste/src/py/doc/tutorial/*.md

  upload-to-website:
    name: "T1 · publish pychaste tutorials"
    needs: generate-tutorial-markdown
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'Chaste/Chaste'
    steps:
      - name: Download pychaste-tutorial-markdown
        uses: actions/download-artifact@v8
        with:
          name: pychaste-tutorial-markdown
          path: pychaste/src/py/doc/tutorial

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          repository: Chaste/Chaste.github.io
          token: ${{ secrets.WEBSITE_ACCESS }}
          path: chaste-website
          fetch-depth: 0  # Fetch all history for all tags and branches

      - name: Display structure of downloaded files
        run: ls -R

      - name: Copy markdown to website repository
        run: |
          cp pychaste/src/py/doc/tutorial/*.md chaste-website/site/content/pychaste/tutorials

      - name: Commit and push if changed
        run: |
          git config user.name "github-action"
          git config user.email "github-action"
          git add --all
          git commit -m "update pychaste tutorials" || echo "No changes to commit"
          git push
        working-directory: chaste-website

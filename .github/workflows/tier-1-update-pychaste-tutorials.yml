name: "T1: PyChaste tutorials"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - '**'

jobs:

  gate:
    uses: ./.github/workflows/_ci-gate.yml

  generate-tutorial-markdown:
    name: "T1 · generate pychaste tutorials"
    needs: gate
    runs-on: ubuntu-latest
    if: needs.gate.outputs.run_tier1 == 'true'
    concurrency:
      group: tier-1-update-pychaste-tutorials-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier1 == 'true' }}
    # One-value matrix: GitHub names a running job "<name> (ran)" but a
    # skipped one just "<name>", so a skipped re-run (e.g. from an
    # unrelated relabel) posts a separate bare row instead of overwriting
    # the real "(ran)" check. See _ci-gate.yml.
    strategy:
      fail-fast: false
      matrix:
        config: [ran]
    steps:
      - name: checkout Chaste
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history in order to get revision info for tutorial files

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: install dependencies
        run: |
          python -m pip install jupyterlab

      - name: generate pychaste tutorial markdown
        run: |
          python GeneratePyChasteTutorials.py
        working-directory: python/infra

      - name: upload archive files
        uses: actions/upload-artifact@v7
        with:
          name: pychaste-tutorial-markdown
          path: |
            pychaste/src/py/doc/tutorial/*.md

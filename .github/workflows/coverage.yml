name: Coverage

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - develop

env:
  # Core count of the runner used below, for cmake, make and ctest.
  CHASTE_NUM_CPUS: 4

jobs:
  build-and-test:

    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:off') }}

    runs-on: ubuntu-26.04

    env:
      CHASTE_DIR: ${{ github.workspace }}/Chaste
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/chaste-test-dir
      CHASTE_BUILD_DIR: ${{ github.workspace }}/Chaste/chaste-build-dir
      CC: gcc
      CXX: g++

    steps:

      - name: checkout Chaste
        uses: actions/checkout@v7
        with:
          path: Chaste
          fetch-depth: 0

      - name: install dependencies
        run: |
          echo 'deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu resolute/' | sudo tee -a /etc/apt/sources.list.d/chaste.list
          sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
          sudo apt update
          sudo apt install chaste-dependencies lcov

      - name: compiler version
        run: ${CXX} --version

      - name: make build and test directories
        run: |
          mkdir -p ${CHASTE_BUILD_DIR}
          mkdir -p ${CHASTE_TEST_OUTPUT}

      - name: cmake configure
        run: cmake -DCMAKE_BUILD_TYPE=Debug -DChaste_COVERAGE_CPUS=${CHASTE_NUM_CPUS} ..
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: build Continuous
        run: cmake --build . --target Continuous --parallel ${CHASTE_NUM_CPUS}
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: build Parallel
        run: cmake --build . --target Parallel --parallel ${CHASTE_NUM_CPUS}
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: run TestChasteBuildInfo
        run: ctest -V -R TestChasteBuildInfo
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: run Continuous
        run: ctest -j${CHASTE_NUM_CPUS} -L Continuous --output-on-failure
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: run Parallel
        run: ctest -L Parallel --output-on-failure
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      - name: capture coverage
        # lcov 2.x makes fatal several conditions that 1.x only warned about; --ignore-errors
        # demotes them back to warnings.
        #
        # "mismatch" is for incorrect information in the coverage data or source, such as
        # overlapping exclusion directives. Chaste uses both LCOV_EXCL_* markers and the
        # lcov_excl_line regex in cmake/Config/lcovrc, so these are expected.
        #
        # "unused" on remove fires when a pattern below matches no file, which several of
        # these are likely to do.
        run: |
          lcov --config-file ${CHASTE_DIR}/cmake/Config/lcovrc --directory . --capture --ignore-errors mismatch --output-file coverage.info
          lcov --config-file ${CHASTE_DIR}/cmake/Config/lcovrc --remove coverage.info '/usr/*' '*/fortests/*' '*/test/*' '*/3rdparty/*' '*/global/src/random/*' 'Debug/*' 'Debug_*/*' '*/cxxtest/*' --ignore-errors unused --output-file coverage.info
        working-directory: ${{ env.CHASTE_BUILD_DIR }}

      # Uploaded before the codecov step so the coverage data is retained even if the
      # upload below fails.
      - name: upload coverage as artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-info
          path: ${{ env.CHASTE_BUILD_DIR }}/coverage.info

      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        # Skip on forks running this workflow against their own repository, where the upload
        # has nowhere useful to go. Note this does not skip pull requests from forks, which
        # run in the upstream repository's context and whose coverage we do want.
        if: github.repository == 'Chaste/Chaste'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.CHASTE_BUILD_DIR }}/coverage.info
          disable_search: true
          # Pull requests from forks cannot read secrets, so they upload tokenlessly and are
          # subject to codecov's global rate limit. Don't fail those runs for something the
          # contributor cannot fix.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

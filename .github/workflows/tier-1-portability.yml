name: "T1: Portability"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop
  schedule:
    - cron: "22 22 * * 0"

permissions:
  contents: read

jobs:
  gate:
    uses: $/.github/workflows/_ci-gate.yml

  build-and-test:
    name: "T1 · portability"

    needs: gate

    if: needs.gate.outputs.run_tier1 == 'true'

    concurrency:
      group: tier-1-portability-${{ github.event.pull_request.number || github.ref }}-${{ strategy.job-index }}
      cancel-in-progress: ${{ needs.gate.outputs.cancel_tier1 == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        # `variant` is the only base dimension, so it is the only value GitHub
        # puts in the check name. The runner image and any extra cmake args
        # ride along in `include:` and stay out of the name.
        variant:
          - "01"
          - "01-no-cvode-vtk"
          - "02"
          - "03"
          - "04"
          - "05"
          - "tip"
          - "jammy"
          - "noble"
          - "resolute"
        include:
          - variant: "01"
            image: portability-01
            extra-build-args: ""
          - variant: "01-no-cvode-vtk"
            image: portability-01
            extra-build-args: "-DChaste_USE_CVODE=OFF -DChaste_USE_VTK=OFF"
          - variant: "02"
            image: portability-02
            extra-build-args: ""
          - variant: "03"
            image: portability-03
            extra-build-args: ""
          - variant: "04"
            image: portability-04
            extra-build-args: ""
          - variant: "05"
            image: portability-05
            extra-build-args: ""
          - variant: "tip"
            image: portability-tip
            extra-build-args: ""
          - variant: "jammy"
            image: portability-jammy
            extra-build-args: ""
          - variant: "noble"
            image: portability-noble
            extra-build-args: ""
          - variant: "resolute"
            image: portability-resolute
            extra-build-args: ""

    runs-on: ubuntu-latest

    container:
      image: chaste/runner:${{ matrix.image }}
      env:
        RUNNER_OFF: 1
      options: --user 0

    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compiler version
        run: |
          ${CXX} --version

      - name: Make build and test directories
        run: |
          mkdir -p chaste-build-dir
          mkdir -p chaste-test-dir
          echo "CHASTE_TEST_OUTPUT=$(pwd)/chaste-test-dir" >> ${GITHUB_ENV}

      - name: Create module loading script
        run: |
          cat > load_modules.sh << 'EOF'
          #!/bin/bash
          source /etc/profile.d/modules.sh
          module use /home/runner/modules/modulefiles
          module avail
          module load boost petsc_hdf5 sundials vtk xercesc xsd
          module list
          EOF
        working-directory: chaste-build-dir

      - name: Authorize runner user
        run: |
          chown -R runner:runner .

      - name: Configure
        run: |
          su runner << 'EOF'
          source load_modules.sh
          cmake -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra-build-args }} ..
          EOF
        working-directory: chaste-build-dir

      - name: TestChasteBuildInfo
        run: |
          su runner << 'EOF'
          source load_modules.sh
          cmake --build . --target TestChasteBuildInfo --parallel $(nproc)
          ctest -V -R TestChasteBuildInfo$
          EOF
        working-directory: chaste-build-dir

      - name: Build Continuous
        run: |
          su runner << 'EOF'
          source load_modules.sh
          cmake --build . --target Continuous --parallel $(nproc)
          EOF
        working-directory: chaste-build-dir

      - name: Build Nightly
        run: |
          su runner << 'EOF'
          source load_modules.sh
          cmake --build . --target Nightly --parallel $(nproc)
          EOF
        working-directory: chaste-build-dir

      - name: Build Parallel
        run: |
          su runner << 'EOF'
          source load_modules.sh
          cmake --build . --target Parallel --parallel $(nproc)
          EOF
        working-directory: chaste-build-dir

      - name: Run Continuous
        run: |
          su runner << 'EOF'
          source load_modules.sh
          ctest -j $(nproc) -L Continuous --output-on-failure
          EOF
        working-directory: chaste-build-dir

      - name: Run Nightly
        run: |
          su runner << 'EOF'
          source load_modules.sh
          ctest -j $(nproc) -L Nightly --output-on-failure
          EOF
        working-directory: chaste-build-dir

      - name: Run Parallel
        run: |
          su runner << 'EOF'
          source load_modules.sh
          ctest -L Parallel --output-on-failure
          EOF
        working-directory: chaste-build-dir

name: Ubuntu tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

jobs:

  build-and-test:

    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:off') }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-26.04"
            codename: "resolute"
            cc: "gcc"
            cxx: "g++"
          - os: "ubuntu-26.04"
            codename: "resolute"
            cc: "icx"
            cxx: "icpx"
          - os: "ubuntu-24.04"
            codename: "noble"
            cc: "gcc"
            cxx: "g++"

    env:
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/chaste-test-dir
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: install dependencies
      run: |
        echo 'deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu ${{ matrix.codename }}/' | sudo tee -a /etc/apt/sources.list.d/chaste.list
        sudo wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
        sudo apt update
        sudo apt install chaste-dependencies

    - name: install and set up Intel LLVM compiler
      run: |
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        sudo apt update
        sudo apt install intel-oneapi-compiler-dpcpp-cpp
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
      if: ${{ matrix.cc == 'icx' }}

    - name: compiler version
      run: |
        ${CXX} --version

    - name: make build and test directories
      run: |
        mkdir -p chaste-build-dir
        mkdir -p ${CHASTE_TEST_OUTPUT}

    - name: cmake configure
      run: cmake -DCMAKE_BUILD_TYPE=Release ..
      working-directory: chaste-build-dir

    - name: build core libraries
      run: cmake --build . --parallel 4 --target chaste_core
      working-directory: chaste-build-dir

    - name: build cell_based
      run: cmake --build . --parallel 4 --target chaste_cell_based
      working-directory: chaste-build-dir

    - name: build crypt
      run: cmake --build . --parallel 4 --target chaste_crypt
      working-directory: chaste-build-dir

    - name: build heart
      run: cmake --build . --parallel 4 --target chaste_heart
      working-directory: chaste-build-dir

    - name: build lung
      run: cmake --build . --parallel 4 --target chaste_lung
      working-directory: chaste-build-dir

    - name: build continuous test pack
      run: cmake --build . --parallel 4 --target Continuous
      working-directory: chaste-build-dir

    - name: build nightly test pack
      run: cmake --build . --parallel 4 --target Nightly
      working-directory: chaste-build-dir

    - name: build parallel test pack
      run: cmake --build . --parallel 4 --target Parallel
      working-directory: chaste-build-dir

    - name: run Continuous test pack
      run: ctest -j4 -L Continuous --output-on-failure
      working-directory: chaste-build-dir

    # Diagnostic (temporary): the four cell_based failures on the 26.04 gcc leg are
    # suspected to come from glibc's amd64v3 (FMA/AVX2) libm transcendentals, not from
    # Chaste's own code. Re-run just those tests with the CPU-optimised libm paths
    # disabled via GLIBC_TUNABLES. If they PASS here but FAIL in the baseline above,
    # the glibc FMA libm is confirmed as the cause (and explains why the icx leg,
    # which uses Intel libimf rather than glibc libm, is unaffected).
    - name: diagnose libm FP divergence (glibc hwcaps)
      if: ${{ always() && matrix.cc == 'gcc' && matrix.codename == 'resolute' }}
      working-directory: chaste-build-dir
      run: |
        echo "===== CPU features of interest ====="
        grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(fma|avx2|avx|avx512f|sse4_2)$' | sort -u | paste -sd' '
        echo "===== glibc version ====="
        ldd --version | head -1
        FAILING='^(TestCellPopulationWriters|TestOffLatticeSimulation|TestOffLatticeSimulationWithNodeBasedCellPopulation|TestVolumeTrackingModifier)$'
        echo "===== BASELINE: default glibc libm ====="
        ctest -j4 -R "$FAILING" --output-on-failure || true
        echo "===== FORCED: AVX2/FMA/AVX/AVX512 libm paths disabled ====="
        GLIBC_TUNABLES=glibc.cpu.hwcaps=-AVX512F,-AVX512VL,-AVX512DQ,-AVX512BW,-AVX2,-AVX,-FMA,-FMA4 \
          ctest -j4 -R "$FAILING" --output-on-failure || true

    - name: run Nightly test pack
      run: ctest -j4 -L Nightly --output-on-failure
      working-directory: chaste-build-dir

    - name: run Parallel test pack
      run: ctest -j4 -L Parallel --output-on-failure
      working-directory: chaste-build-dir

    - name: run TestChasteBuildInfo
      run: |
        ctest -V -R TestChasteBuildInfo
      working-directory: chaste-build-dir

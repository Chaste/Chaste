name: PyChaste Ubuntu tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

# Limit concurrent runs to one per branch
concurrency:
  group: pychaste-ubuntu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pychaste-ubuntu-tests:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:off') }}

    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.image }}

    env:
      DEBIAN_FRONTEND: noninteractive
      CHASTE_TEST_OUTPUT: ${{ github.workspace }}/testoutput

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make build and test directories
        run: |
          mkdir -p build
          mkdir -p ${CHASTE_TEST_OUTPUT}

      - name: Install basic system dependencies
        run: |
          apt-get update &&
          apt-get install -y \
            apt-transport-https \
            apt-utils \
            ca-certificates \
            build-essential \
            git \
            wget

      - name: Install Chaste dependencies
        run: |
          codename=$(cat /etc/os-release | grep VERSION_CODENAME | cut -d= -f2)
          wget -O /usr/share/keyrings/chaste.asc https://chaste.github.io/chaste.asc
          echo "deb [signed-by=/usr/share/keyrings/chaste.asc] https://chaste.github.io/ubuntu ${codename}/" \
            | tee -a /etc/apt/sources.list.d/chaste.list
          apt-get update &&
          apt-get install -y chaste-dependencies

      - name: Get system VTK version
        run: |
          vtk_ver=
          for candidate in $(seq 7 99); do
            vtk_pkg="$(apt-cache search --names-only ^libvtk${candidate}-dev$)"
            if [ -n "${vtk_pkg}" ]; then
              vtk_ver="${candidate}"
              break
            fi
          done
          echo "VTK version: ${vtk_ver}"
          echo "VTK_VERSION=${vtk_ver}" >> $GITHUB_ENV

      - name: Install extra PyChaste dependencies
        run: |
          apt-get install -y \
            castxml \
            clang \
            python3-matplotlib \
            python3-mpi4py \
            python3-notebook \
            python3-numpy \
            python3-petsc4py-real \
            python3-pip \
            python3-vtk${{ env.VTK_VERSION }} \
            python3-xvfbwrapper \
            xvfb

      - name: Install CastXML superbuild on Ubuntu 24.04
        if: ${{ matrix.image == 'ubuntu:24.04' }}
        run: |
          # The apt castxml (0.6.3) cannot parse Ubuntu 24.04's gcc-13
          # system headers, so install a newer castxml binary instead.
          wget -qO- https://github.com/CastXML/CastXMLSuperbuild/releases/download/v2026.01.30/castxml-ubuntu-24.04-x86_64.tar.gz \
            | tar -xz -C /opt
          echo "/opt/castxml/bin" >> "${GITHUB_PATH}"

      - name: Configure PyChaste
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DChaste_ENABLE_PYCHASTE=ON ..
        working-directory: build

      - name: Build PyChaste
        run: |
          make -j $(nproc) pychaste
        working-directory: build

      - name: Install PyChaste
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 \
          python3 -m pip install -v --user pychaste/package
        working-directory: build

      - name: Run PyChaste tests
        run: |
          xvfb-run --server-args="-screen 0 1024x768x24" \
            ctest -j $(nproc) -L pychaste --output-on-failure
        working-directory: build

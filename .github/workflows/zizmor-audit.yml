name: Audit workflows with zizmor

on:
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Generate SARIF for code scanning
        run: |
          uvx zizmor --format sarif .github/workflows > results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Annotate findings and fail if any were found
        run: |
          uvx zizmor --format github .github/workflows

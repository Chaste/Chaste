name: Audit workflows with zizmor

on:
  schedule:
    - cron: '15 3 * * 1'  # Every Monday at 03:15 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor (upload to code scanning)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows

      - name: Run zizmor (annotate and fail on findings)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

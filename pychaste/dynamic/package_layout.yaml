# PyChaste Python package layout for the `cppwg genpackage` tool.
#
# PyChaste compiles a single _pychaste_all extension that contains all wrapped
# classes, using the settings in config.yaml. The wrappers are manually split
# into subpackages purely in Python. Each subpackage lists the wrappers it owns
# in the layout below. The `cppwg genpackage` tool uses this layout to create a
# _generated.py in each subpackage, each containing an explicit
# `from chaste._pychaste_all import (<list_of_classes>)` plus the TemplateClass
# stubs that enable syntax such as Element[2,2] instead of Element_2_2.
# The hand-written __init__.py in each subpackage imports all of these via
# `from ._generated import *` and may add additional manually maintained code.
package: chaste
compiled_module: _pychaste_all
# package_root is resolved relative to this layout file's directory.
package_root: ../src/py/chaste
# This makes sure that Element[2] is added as an alias for Element[2, 2].
diagonal_shorthand: true
# This makes sure chaste.ClassName works as well as chaste.subpackage.ClassName.
flatten_to_root: true
# Abstract base classes must be wrapped, but are deliberately not exposed here
# as they are not meant to be named, instantiated or subclassed from Python.
exclude:
  - AbstractBoundaryCondition
  - AbstractBoxDomainPdeModifier
  - AbstractCaBasedDivisionRule
  - AbstractCaSwitchingUpdateRule
  - AbstractCaUpdateRule
  - AbstractCellBasedSimulation
  - AbstractCellBasedSimulationModifier
  - AbstractCellBasedWriter
  - AbstractCellCycleModel
  - AbstractCellCycleModelOdeSolver
  - AbstractCellKiller
  - AbstractCellMutationState
  - AbstractCellPopulation
  - AbstractCellPopulationBoundaryCondition
  - AbstractCellPopulationCountWriter
  - AbstractCellPopulationEventWriter
  - AbstractCellPopulationWriter
  - AbstractCellProliferativeType
  - AbstractCellProperty
  - AbstractCellWriter
  - AbstractCentreBasedCellPopulation
  - AbstractCentreBasedDivisionRule
  - AbstractChasteRegion
  - AbstractElement
  - AbstractForce
  - AbstractGrowingDomainPdeModifier
  - AbstractImmersedBoundaryDivisionRule
  - AbstractImmersedBoundaryForce
  - AbstractLinearEllipticPde
  - AbstractLinearParabolicPde
  - AbstractLinearParabolicPdeSystemForCoupledOdeSystem
  - AbstractLinearPde
  - AbstractMesh
  - AbstractNumericalMethod
  - AbstractOdeBasedCellCycleModel
  - AbstractOdeBasedPhaseBasedCellCycleModel
  - AbstractOdeSrnModel
  - AbstractOdeSystem
  - AbstractOdeSystemInformation

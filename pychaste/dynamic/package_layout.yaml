# Python-package layout for cppwg genpackage (pychaste).
#
# pychaste compiles a SINGLE extension (_pychaste_all) that is split into six
# subpackages purely in the Python layer. cppwg's config has one `all` module,
# so the split lives here: each subpackage lists the wrapped base names it owns.
# The generator emits an explicit `from chaste._pychaste_all import (...)` plus
# the TemplateClass stubs into each subpackage's _generated.py; the hand-written
# __init__.py does `from ._generated import *` and keeps the bespoke pieces
# (top-level petsc init(), cell_based's writer-subscript loop + _fortests,
# visualization's IPython gating + _jupyter + JupyterSceneModifier stub).
#
# package_root is resolved relative to this layout file's directory.
package: chaste
package_root: ../src/py/chaste
compiled_module: _pychaste_all
# pychaste offers a single-arg diagonal shorthand for its <ELEMENT_DIM,
# SPACE_DIM> classes: Element[2] is an alias for Element[2, 2].
diagonal_shorthand: true
# Also expose every wrapped class at the top level as chaste.ClassName,
# in addition to chaste.subpackage.ClassName.
flatten_to_root: true
subpackages:
  core:
    - ChasteBuildInfo
    - FileFinder
    - Identifiable
    - OutputFileHandler
    - PetscSetupUtils
    - PetscTools
    - ProgressReporter
    - RandomNumberGenerator

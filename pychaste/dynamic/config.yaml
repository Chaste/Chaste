# Package name; prepended to every module name (e.g. pychaste._pychaste_all).
name: pychaste

# Smart pointer holder type declared in every class wrapper.
smart_ptr_type: boost::shared_ptr

# Default pybind11 return_value_policy for methods returning a pointer.
pointer_call_policy: reference

# Default pybind11 return_value_policy for methods returning a reference.
reference_call_policy: reference_internal

# OFF: each wrapper includes only the headers it needs.
common_include_file: OFF

# Automatically include the headers each wrapper needs.
auto_includes: True

# Auto-include type-caster headers in wrappers who use their types.
typecasters:
  - header: PybindPetscTypeCaster.hpp
    types: [Vec, Mat]
  - header: PybindUblasTypeCaster.hpp
    types: [boost::numeric::ublas::c_vector]
  - header: PybindVTKTypeCaster.hpp
    types: [vtkSmartPointer, vtkNew]

# Headers added to every class wrapper.
source_includes:
  - <map>
  - <set>
  - <string>
  - <vector>
  - SmartPointers.hpp

# Automatically discover explicit template instantiations from the source .cpp
# files (except for dimension 0).
discover_template_instantiations: True
discover_arg_excludes:
  DIM: [0]
  SPACE_DIM: [0]
  ELEMENT_DIM: [0]

# Special template substitutions for CellsGenerator<CELL_CYCLE_MODEL, DIM>
# which is header-only and never explicitly instantiated.
template_substitutions:
  - signature: <class CELL_CYCLE_MODEL, unsigned DIM>
    replacement:
      - [Alarcon2004OxygenBasedCellCycleModel, 2]
      - [Alarcon2004OxygenBasedCellCycleModel, 3]
      - [AlwaysDivideCellCycleModel, 2]
      - [AlwaysDivideCellCycleModel, 3]
      - [BernoulliTrialCellCycleModel, 2]
      - [BernoulliTrialCellCycleModel, 3]
      - [BiasedBernoulliTrialCellCycleModel, 2]
      - [BiasedBernoulliTrialCellCycleModel, 3]
      - [ContactInhibitionCellCycleModel, 2]
      - [ContactInhibitionCellCycleModel, 3]
      - [ExponentialG1GenerationalCellCycleModel, 2]
      - [ExponentialG1GenerationalCellCycleModel, 3]
      - [FixedG1GenerationalCellCycleModel, 2]
      - [FixedG1GenerationalCellCycleModel, 3]
      - [FixedSequenceCellCycleModel, 2]
      - [FixedSequenceCellCycleModel, 3]
      - [GammaG1CellCycleModel, 2]
      - [GammaG1CellCycleModel, 3]
      - [LabelDependentBernoulliTrialCellCycleModel, 2]
      - [LabelDependentBernoulliTrialCellCycleModel, 3]
      - [NoCellCycleModel, 2]
      - [NoCellCycleModel, 3]
      - [SimpleOxygenBasedCellCycleModel, 2]
      - [SimpleOxygenBasedCellCycleModel, 3]
      - [StochasticOxygenBasedCellCycleModel, 2]
      - [StochasticOxygenBasedCellCycleModel, 3]
      - [TysonNovakCellCycleModel, 2]
      - [TysonNovakCellCycleModel, 3]
      - [UniformCellCycleModel, 2]
      - [UniformCellCycleModel, 3]
      - [UniformG1GenerationalCellCycleModel, 2]
      - [UniformG1GenerationalCellCycleModel, 3]

# Translate Chaste C++ exceptions into Python exceptions.
exceptions:
  - name: Exception
    message_method: GetMessage

# The Python modules to build; pychaste uses a single module named `all`.
modules:
  - name: all
    # Directories (relative to the source root) whose classes this module wraps.
    source_locations:

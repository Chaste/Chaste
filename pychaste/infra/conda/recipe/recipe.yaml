schema_version: 1

context:
  version: ${{ env.get("CHASTE_VERSION", default="2026.1") }}

package:
  name: chaste
  version: ${{ version }}

source:
  path: ${{ env.get("CHASTE_SOURCE_DIR", default="/tmp/Chaste") }}
  # Copy the whole tree, including git-tracked files that also match a
  # .gitignore pattern (e.g. the */test/tutorials/ directories vs the ignored
  # "tutorials" pattern). Without this rattler-build omits them and their test
  # targets fail to configure with "No SOURCES given to target".
  use_gitignore: false

build:
  number: 1
  # rattler-build sanitizes the build environment and otherwise defaults
  # CPU_COUNT to the logical CPU count; forward the value set by
  # build-package.sh so the C++ compile (make -j) stays within the chosen bound.
  script:
    file: build.sh
    env:
      CPU_COUNT: ${{ env.get("CPU_COUNT", default="") }}

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - castxml
    - cmake
    - git
    - hdf5
    - hdf5 * mpi_mpich_*
    - libtiff
    - make
    - matplotlib
    - metis
    - mpi4py
    - mpich
    - numpy
    - parmetis
    - petsc
    - petsc4py
    - pip
    - python
    - sundials
    - vtk
    - xerces-c
    - xsd
    - xvfbwrapper
  host:
    - boost-cpp
    - hdf5
    - hdf5 * mpi_mpich_*
    - libtiff
    # X11 libraries (provide the headers VTK's find_package(X11) needs at
    # configure time). These replace the legacy cdt() CDT packages, which
    # rattler-build installs outside the sysroot that cmake's FindX11 searches.
    - xorg-libice
    - xorg-libsm
    - xorg-libx11
    - xorg-libxext
    - xorg-libxt
    - xorg-xorgproto
    - matplotlib
    - metis
    - mpi4py
    - mpich
    - numpy
    - parmetis
    - petsc
    - petsc4py
    - pip
    - python
    - sundials
    - vtk
    - xerces-c
    - xsd
    - xvfbwrapper
  run:
    - boost-cpp
    - hdf5
    - hdf5 * mpi_mpich_*
    - libboost
    - libopenblas
    - libtiff
    - matplotlib
    - metis
    - mpi4py
    - mpich
    - numpy
    - parmetis
    - petsc
    - petsc4py
    - python
    - sundials
    - vtk
    - xerces-c
    - xsd
    - xvfbwrapper

tests:
  - python:
      imports:
        - chaste
        - chaste.cell_based
        - chaste.mesh
        - chaste.ode
        - chaste.pde
        - chaste.visualization

about:
  homepage: https://chaste.github.io
  license: BSD-3-Clause
  summary: >
    Chaste is a general purpose simulation package for computational biology.
  repository: https://github.com/Chaste/Chaste/
  documentation: https://chaste.github.io/docs/

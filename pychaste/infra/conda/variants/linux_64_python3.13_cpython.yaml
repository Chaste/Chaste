  - "11"
boostcpp:
  - ">=1.70,<1.84"
hdf5:
  - ">=1.10,<1.15"
metis:
  - ">=4.0,<6.0"
mpich:
  - ">=4.0,<5.0"
parmetis:
  - ">=4.0,<6.0"
petsc:
  - ">=3.19,<3.26"
petsc4py:
  - ">=3.19,<3.26"
numpy:
  - "2.0"
python:
  - 3.13.* *_cpython
sundials:
  - ">=3.0,<7.0"
vtk:
  - ">=7.1,<9.4"
xercesc:
  - ">=3.0,<4.0"
target_platform:
  - linux-64
zip_keys:
